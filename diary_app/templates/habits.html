{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Habit Tracker</h1>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-header bg-success text-white">Create Habit</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Habit Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Read 10 Pages" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Icon</label>
                        <select name="icon" class="form-select">
                            <option value="✅">✅ Check</option>
                            <option value="💧">💧 Water</option>
                            <option value="🏃">🏃 Run</option>
                            <option value="🧘">🧘 Meditate</option>
                            <option value="📚">📚 Read</option>
                            <option value="🥗">🥗 Healthy Eat</option>
                            <option value="💊">💊 Vitamin</option>
                            <option value="🧹">🧹 Clean</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Add Habit</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header">My Habits</div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Icon</th>
                            <th>Habit</th>
                            <th>Completions</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for habit in habits %}
                        <tr>
                            <td style="font-size: 1.5rem;">{{ habit.icon }}</td>
                            <td class="align-middle">{{ habit.name }}</td>
                            <td class="align-middle">{{ habit.completions|length }} times</td>
                            <td class="align-middle">
                                <form action="{{ url_for('main.delete_habit', habit_id=habit.id) }}" method="POST" onsubmit="return confirm('Delete this habit?');">
                                    <button class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No habits yet. Create one!</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
