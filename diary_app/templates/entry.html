{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center" id="entry-container">
    <div class="col-md-8 transition-all" id="main-col">

        <div class="d-flex justify-content-end mb-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="zen-mode-btn">Zen Mode 🧘</button>
        </div>

        <div class="card">
            <div class="card-header">
                {% if entry %}Edit Entry{% else %}New Entry{% endif %}
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="entry_date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="entry_date" name="entry_date"
                                   value="{{ entry.entry_date.strftime('%Y-%m-%d') if entry else today }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="weather" class="form-label">Weather</label>
                            <select class="form-select" id="weather" name="weather">
                                <option value="" {% if not entry or not entry.weather %}selected{% endif %}>Unknown</option>
                                <option value="Sunny" {% if entry and entry.weather == 'Sunny' %}selected{% endif %}>☀️ Sunny</option>
                                <option value="Rainy" {% if entry and entry.weather == 'Rainy' %}selected{% endif %}>🌧️ Rainy</option>
                                <option value="Cloudy" {% if entry and entry.weather == 'Cloudy' %}selected{% endif %}>☁️ Cloudy</option>
                                <option value="Snowy" {% if entry and entry.weather == 'Snowy' %}selected{% endif %}>❄️ Snowy</option>
                                <option value="Stormy" {% if entry and entry.weather == 'Stormy' %}selected{% endif %}>⛈️ Stormy</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="mood" class="form-label">Mood</label>
                        <select class="form-select" id="mood" name="mood">
                            <option value="" {% if not entry or not entry.mood %}selected{% endif %}>Select Mood</option>
                            <option value="Happy" {% if entry and entry.mood == 'Happy' %}selected{% endif %}>Happy</option>
                            <option value="Sad" {% if entry and entry.mood == 'Sad' %}selected{% endif %}>Sad</option>
                            <option value="Anxious" {% if entry and entry.mood == 'Anxious' %}selected{% endif %}>Anxious</option>
                            <option value="Neutral" {% if entry and entry.mood == 'Neutral' %}selected{% endif %}>Neutral</option>
                            <option value="Excited" {% if entry and entry.mood == 'Excited' %}selected{% endif %}>Excited</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tags" class="form-label">Tags (comma separated)</label>
                        <input type="text" class="form-control" id="tags" name="tags" placeholder="e.g., work, family, vacation" value="{{ entry.tags if entry and entry.tags else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">What's on your mind?</label>
                        <div class="input-group">
                            <textarea class="form-control" id="content" name="content" rows="10" required>{{ entry.content if entry else '' }}</textarea>
                            <button class="btn btn-outline-secondary" type="button" id="emoji-btn" title="Insert Emoji">
                                😀
                            </button>
                            <button class="btn btn-outline-secondary" type="button" id="mic-btn" title="Dictate Entry">
                                🎤
                            </button>
                        </div>
                        <small class="text-muted" id="mic-status" style="display: none;">Listening...</small>

                        <!-- Simple Emoji Picker (Hidden by default) -->
                        <div id="emoji-picker" class="card p-2 mt-1" style="display: none; position: absolute; z-index: 1000; max-width: 300px;">
                            <div class="d-flex flex-wrap" style="gap: 5px;">
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😀</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😂</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😍</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😭</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😡</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😱</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">👍</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">🎉</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">❤️</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">✨</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">🔥</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">🙏</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">🤔</button>
                                <button type="button" class="btn btn-sm btn-light emoji-insert">😴</button>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>

                {% if entry %}
                <hr>
                <form method="POST" action="{{ url_for('main.delete_entry', entry_id=entry.id) }}" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="btn btn-danger btn-sm">Delete Entry</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<style>
    .zen-active nav { display: none !important; }
    .zen-active .container { max-width: 100% !important; }
    .zen-active #main-col { width: 100% !important; flex: 0 0 100%; max-width: 800px; margin: 0 auto; }
    .zen-active body { background-color: #f8f9fa; }
</style>

<script>
    // Zen Mode
    document.getElementById('zen-mode-btn').addEventListener('click', function() {
        document.body.classList.toggle('zen-active');
        if (document.body.classList.contains('zen-active')) {
            this.textContent = "Exit Zen Mode";
        } else {
            this.textContent = "Zen Mode 🧘";
        }
    });

    // Voice to Text
    const micBtn = document.getElementById('mic-btn');
    const micStatus = document.getElementById('mic-status');
    const contentArea = document.getElementById('content');
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');

    // Emoji Picker Toggle
    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'block' : 'none';

        // Position logic (simple)
        const rect = emojiBtn.getBoundingClientRect();
        emojiPicker.style.top = (window.scrollY + rect.bottom + 5) + 'px';
        emojiPicker.style.left = (window.scrollX + rect.left - 200) + 'px';
    });

    // Insert Emoji
    document.querySelectorAll('.emoji-insert').forEach(btn => {
        btn.addEventListener('click', () => {
            contentArea.value += btn.innerText;
            emojiPicker.style.display = 'none';
            contentArea.focus();
        });
    });

    // Close picker on outside click
    document.addEventListener('click', (e) => {
        if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
            emojiPicker.style.display = 'none';
        }
    });

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.continuous = true;
        recognition.interimResults = true;

        let isListening = false;

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.remove('btn-outline-secondary');
            micBtn.classList.add('btn-danger');
            micStatus.style.display = 'block';
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('btn-danger');
            micBtn.classList.add('btn-outline-secondary');
            micStatus.style.display = 'none';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            // Append to textarea (simple logic, appending at end)
            // Ideally we insert at cursor, but simple append is fine for now
            if (finalTranscript) {
                 contentArea.value += (contentArea.value ? ' ' : '') + finalTranscript;
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error", event.error);
            micStatus.innerText = "Error: " + event.error;
            isListening = false;
        };

    } else {
        micBtn.style.display = 'none';
        console.log("Web Speech API not supported");
    }
</script>
{% endblock %}
