{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">

        <!-- Profile Settings -->
        <div class="card mb-4">
            <div class="card-header">Profile Settings</div>
            <div class="card-body">
                <form action="{{ url_for('main.update_profile') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Change Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ current_user.username }}">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Change Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank to keep current">
                    </div>
                    <button type="submit" class="btn btn-warning">Update Profile</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Appearance</div>
            <div class="card-body">
                <h5 class="card-title">Theme & Style</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label for="theme" class="form-label">Theme Selection</label>
                        <select class="form-select" id="theme" name="theme">
                            <option value="default" {% if current_user.theme_preference == 'default' %}selected{% endif %}>Default (Blue)</option>
                            <option value="dark" {% if current_user.theme_preference == 'dark' %}selected{% endif %}>Dark Mode</option>
                            <option value="nature" {% if current_user.theme_preference == 'nature' %}selected{% endif %}>Nature (Minty)</option>
                            <option value="warm" {% if current_user.theme_preference == 'warm' %}selected{% endif %}>Warm (Sandstone)</option>
                            <option value="professional" {% if current_user.theme_preference == 'professional' %}selected{% endif %}>Professional (Cosmo)</option>
                            <option value="purple" {% if current_user.theme_preference == 'purple' %}selected{% endif %}>Lux (Black/White)</option>
                        </select>
                        <div class="form-text">Select a theme to change the look and feel of your diary.</div>
                    </div>

                    <div class="mb-3">
                        <label for="font" class="form-label">Font Style</label>
                        <select class="form-select" id="font" name="font">
                            <option value="sans" {% if current_user.font_preference == 'sans' %}selected{% endif %}>Sans-Serif (Modern)</option>
                            <option value="serif" {% if current_user.font_preference == 'serif' %}selected{% endif %}>Serif (Classic)</option>
                            <option value="mono" {% if current_user.font_preference == 'mono' %}selected{% endif %}>Monospace (Typewriter)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="avatar" class="form-label">Profile Avatar</label>
                        <select class="form-select" id="avatar" name="avatar">
                            <option value="👤" {% if current_user.avatar_emoji == '👤' %}selected{% endif %}>👤 Generic</option>
                            <option value="🐱" {% if current_user.avatar_emoji == '🐱' %}selected{% endif %}>🐱 Cat</option>
                            <option value="🐶" {% if current_user.avatar_emoji == '🐶' %}selected{% endif %}>🐶 Dog</option>
                            <option value="🦊" {% if current_user.avatar_emoji == '🦊' %}selected{% endif %}>🦊 Fox</option>
                            <option value="🦁" {% if current_user.avatar_emoji == '🦁' %}selected{% endif %}>🦁 Lion</option>
                            <option value="🦄" {% if current_user.avatar_emoji == '🦄' %}selected{% endif %}>🦄 Unicorn</option>
                            <option value="🤖" {% if current_user.avatar_emoji == '🤖' %}selected{% endif %}>🤖 Robot</option>
                            <option value="🧙" {% if current_user.avatar_emoji == '🧙' %}selected{% endif %}>🧙 Wizard</option>
                            <option value="🦸" {% if current_user.avatar_emoji == '🦸' %}selected{% endif %}>🦸 Hero</option>
                            <option value="🧠" {% if current_user.avatar_emoji == '🧠' %}selected{% endif %}>🧠 Brain</option>
                            <option value="💀" {% if current_user.avatar_emoji == '💀' %}selected{% endif %}>💀 Skull</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">Data Management</div>
            <div class="card-body">
                <p>Download a copy of all your diary entries.</p>
                <a href="{{ url_for('main.export_data') }}" class="btn btn-outline-secondary">
                    ⬇️ Export Data (JSON)
                </a>

                <hr>

                <form action="{{ url_for('main.import_data') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Import Data (JSON)</label>
                        <input class="form-control" type="file" id="file" name="file" accept=".json" required>
                    </div>
                    <button type="submit" class="btn btn-outline-warning">⬆️ Restore / Import</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
