{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tag Explorer</h1>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Back to Entries</a>
</div>

<div class="row">
    <div class="col-md-12">
        {% if tags %}
            <div class="card">
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">
                        {% for tag, count in tags %}
                        <a href="{{ url_for('main.index', q=tag) }}" class="btn btn-outline-primary position-relative m-2">
                            {{ tag }}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ count }}
                            </span>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </div>
        {% else %}
            <div class="alert alert-info">
                No tags found. Try adding tags to your entries (e.g., 'work', 'family')!
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
